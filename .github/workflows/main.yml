name: Build Hpreet Vault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o Hpreet-Vault-Android-Source-Starter.zip -d source
          cd source/Hpreet-Vault-Android-Source
          echo "ANDROID_PROJECT=$PWD" >> "$GITHUB_ENV"

      - name: Add required Android libraries
        run: |
          cat >> "$ANDROID_PROJECT/app/build.gradle.kts" <<'EOF'

          dependencies {
              implementation("androidx.biometric:biometric:1.2.0-alpha05")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

      - name: Build Android APK
        run: |
          cd "$ANDROID_PROJECT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hpreet-Vault-APK
          path: source/Hpreet-Vault-Android-Source/app/build/outputs/apk/debug/*.apk
